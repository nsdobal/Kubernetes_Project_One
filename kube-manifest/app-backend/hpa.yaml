apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: hpa-app-backend-ui
  namespace: ns-indri
  labels:
    project: indri
    app: app-backend-ui
    env: dev
    owner: nd
    team: platform
    costcenter: nd
    object: hpa
    tag: hpa-app-backend-ui

spec:
  minReplicas: 1
  maxReplicas: 5

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dep-app-backend
  
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
      - type: Percent 
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60

